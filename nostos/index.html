<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>NOSTOS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700;900&display=swap" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { width:100%; height:100%; overflow:hidden; background:#000; font-family:"Courier New", monospace; }
  #lienzo { display:block; width:100%; height:100%; image-rendering:pixelated; image-rendering:crisp-edges; cursor:none; }
  #capa { position:fixed; inset:0; pointer-events:none; opacity:0; transition:opacity .35s; }
  body.jugando #capa { opacity:1; }

  :root { --tono:#e8c14a; }
  #mira { position:absolute; z-index:6; left:50%; top:50%; width:18px; height:18px; transform:translate(-50%,-50%); opacity:.6; }
  #mira::before, #mira::after { content:""; position:absolute; background:var(--tono); }
  #mira::before { left:50%; top:0; width:2px; height:100%; margin-left:-1px; }
  #mira::after { top:50%; left:0; height:2px; width:100%; margin-top:-1px; }
  body[data-mira="punto"] #mira::before { top:50%; height:4px; margin-top:-2px; width:4px; margin-left:-2px; border-radius:50%; }
  body[data-mira="punto"] #mira::after { display:none; }
  body[data-mira="anillo"] #mira { border:2px solid var(--tono); border-radius:50%; }
  body[data-mira="anillo"] #mira::before, body[data-mira="anillo"] #mira::after { display:none; }
  body[data-mira="nada"] #mira { display:none; }

  .caja { position:absolute; z-index:6; color:#f2e2b0; letter-spacing:2px; line-height:1;
          text-shadow:3px 3px 0 #000, 0 0 16px rgba(0,0,0,.95); }
  .caja b { display:block; font-size:68px; color:var(--tono); }
  .caja span { font-size:13px; letter-spacing:6px; color:#c9b48a; }
  .caja.chica b { font-size:34px; }
  .caja.chica span { font-size:11px; letter-spacing:4px; }

  #cVida    { left:112px; bottom:22px; }
  #cFlechas { right:26px; bottom:22px; text-align:right; }
  #cArmadura{ left:112px; bottom:106px; }
  #cArmadura b { color:#8fb4c9; }
  #cRayo    { left:112px; bottom:166px; display:none; }
  #cRayo b  { color:#bfe4ff; }
  #cRayo.ver { display:block; }
  #cOro     { right:26px; top:150px; text-align:right; }
  #cBajas   { right:26px; top:214px; text-align:right; }
  #cBajas b { color:#c9a227; }
  #cRonda   { right:26px; top:22px; text-align:right; }
  #cRonda b { color:#e2482d; }
  #cVivos   { right:26px; top:86px; text-align:right; }

  #cara { position:absolute; z-index:6; left:26px; bottom:22px; width:76px; height:76px;
          border:3px solid #6b4a22; background:#3a2a18 center/cover no-repeat;
          image-rendering:pixelated; box-shadow:0 0 18px rgba(0,0,0,.85); }

  #mapa { position:absolute; z-index:6; left:22px; top:20px; width:208px; height:150px;
          border:3px solid #6b4a22; background:rgba(10,7,4,.6); image-rendering:pixelated;
          box-shadow:0 0 20px rgba(0,0,0,.8); }
  #marcas { position:absolute; z-index:5; inset:0; }

  #banner { position:absolute; left:0; right:0; top:16%; text-align:center; z-index:6;
            color:#e8c14a; opacity:0; transition:opacity .5s;
            text-shadow:3px 3px 0 #000, 0 0 26px #a3450d; }
  #banner b { display:block; font-size:52px; letter-spacing:10px; }
  #banner span { font-size:14px; letter-spacing:6px; color:#f2e2b0; opacity:.8; }
  #banner.ver { opacity:1; }

  #aviso { position:absolute; left:0; right:0; bottom:26%; text-align:center; z-index:6;
           color:#f2e2b0; font-size:15px; letter-spacing:5px; opacity:0;
           transition:opacity .35s; text-shadow:2px 2px 0 #000; }
  #aviso.ver { opacity:1; }

  #menu { position:fixed; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center;
          background:rgba(10,6,4,.55); color:#f2e2b0; text-align:center; }
  #menu h1 { font-family:"Cinzel Decorative","Times New Roman",serif; font-weight:900;
              font-size:13vw; letter-spacing:.6vw; color:#e8c14a; line-height:1;
              text-shadow:0 0 46px #a3450d, 0 0 14px #ffb15e, 5px 5px 0 #000; }
  #menu h2 { font-family:"Cinzel Decorative","Times New Roman",serif; font-weight:700;
              font-size:2.6vw; letter-spacing:.9vw; opacity:.7; margin-top:.4vw; color:#f2e2b0; }
  #menu p  { margin-top:6vh; font-size:14px; letter-spacing:4px; animation:latir 1.6s infinite; }
  #botonera { margin-top:5vh; display:flex; gap:14px; animation:none; }
  .boton { padding:12px 26px; background:rgba(74,52,24,.75); color:#f2e2b0;
           border:2px solid #6b4a22; font-family:inherit; font-size:12px;
           letter-spacing:4px; cursor:pointer; transition:background .15s, border-color .15s; }
  .boton:hover { background:#6b4a22; border-color:#e8c14a; color:#fff; }
  .boton.salir { background:rgba(90,20,16,.7); border-color:#7a2a20; }
  .boton.salir:hover { background:#7a2a20; border-color:#e2482d; }

  #panel { position:fixed; inset:0; z-index:30; display:none; align-items:center;
           justify-content:center; background:rgba(8,5,3,.9); font-family:"Courier New",monospace; }
  #panel.ver { display:flex; }
  #panel .hoja { width:min(1060px,94vw); max-height:88vh; overflow-y:auto; padding:30px 34px;
                 background:linear-gradient(#241811,#140d08); border:3px solid #6b4a22;
                 box-shadow:0 0 60px rgba(0,0,0,.9); }
  #panel h3 { font-family:"Cinzel Decorative",serif; color:#e8c14a; font-size:30px;
              letter-spacing:6px; text-align:center; margin-bottom:22px; }
  #panel table { width:100%; border-collapse:collapse; }
  #panel td { padding:9px 12px; border-bottom:1px solid #33251a; color:#c9b48a;
              font-size:13px; letter-spacing:1px; vertical-align:middle; }
  #panel td.tecla { color:#e8c14a; font-size:14px; letter-spacing:3px; width:190px; white-space:nowrap; }
  #panel td.ico { width:58px; }
  #panel td.ico div { width:46px; height:46px; background:center/contain no-repeat; image-rendering:pixelated; }
  #panel td.nom { color:#f2e2b0; width:230px; letter-spacing:2px; }
  #panel td.precio { color:#e8c14a; text-align:right; width:110px; white-space:nowrap; }
  #panel h4 { color:#a08a63; font-size:12px; letter-spacing:5px; margin:26px 0 6px; }
  #panel h4:first-of-type { margin-top:0; }
  #panel .cerrar { display:block; margin:26px auto 0; }
  #panel .opciones { display:flex; flex-wrap:wrap; gap:10px; margin-bottom:8px; }
  #panel .opcion { padding:10px 18px; border:2px solid #4a3418; background:rgba(0,0,0,.35);
                   color:#c9b48a; font-size:11px; letter-spacing:2px; cursor:pointer;
                   display:flex; align-items:center; gap:9px; }
  #panel .opcion:hover { border-color:#e8c14a; color:#f2e2b0; }
  #panel .opcion.puesta { border-color:#e8c14a; color:#f2e2b0; background:rgba(232,193,74,.14); }
  #panel .muestra { width:16px; height:16px; border:1px solid #000; }
  @keyframes latir { 50% { opacity:.25; } }
  #menu.oculto { display:none; }

  #ranuras { position:absolute; z-index:6; right:26px; bottom:118px; display:flex; gap:8px; }
  .ranura { width:52px; height:52px; border:2px solid #6b4a22; background:rgba(20,13,8,.72) center/72% no-repeat;
            image-rendering:pixelated; position:relative; }
  .ranura i { position:absolute; top:1px; left:4px; font-size:10px; font-style:normal; color:#e8c14a; opacity:.7; }
  .ranura u { position:absolute; bottom:1px; right:4px; font-size:13px; text-decoration:none; color:#f2e2b0; }
  .ranura.eterna { border-color:#3fa9ff; box-shadow:0 0 14px rgba(63,169,255,.45); }
  .ranura.eterna u { color:#8fd0ff; font-size:17px; }

  #tienda { position:fixed; inset:0; z-index:20; display:none; align-items:center; justify-content:center;
            background:rgba(8,5,3,.86); font-family:"Courier New",monospace; }
  #tienda.ver { display:flex; }
  #tienda .marco { width:min(1020px,94vw); padding:30px 34px 26px; background:linear-gradient(#241811,#140d08);
                   border:3px solid #6b4a22; box-shadow:0 0 60px rgba(0,0,0,.9); text-align:center; }
  #tienda .cabeza { display:flex; align-items:center; gap:22px; margin-bottom:20px; text-align:left; }
  #tienda .retrato { width:132px; height:132px; flex:none; background:center/contain no-repeat;
                     image-rendering:pixelated; filter:drop-shadow(0 0 16px rgba(232,193,74,.28)); }
  #tienda h3 { color:#e8c14a; font-size:34px; letter-spacing:12px; text-shadow:3px 3px 0 #000; }
  #tienda .lema { color:#a08a63; font-size:12px; letter-spacing:4px; margin-top:8px; }
  #tienda .rejilla { display:grid; grid-template-columns:repeat(4,1fr); gap:14px; }
  #tienda .carta { padding:16px 12px; border:2px solid #4a3418; background:rgba(0,0,0,.35);
                   cursor:pointer; transition:transform .12s, border-color .12s; }
  #tienda .carta:hover { transform:translateY(-5px); border-color:#e8c14a; }
  #tienda .carta.pobre { opacity:.34; cursor:not-allowed; }
  #tienda .carta.pobre:hover { transform:none; border-color:#4a3418; }
  #tienda .ico { height:72px; background:center/contain no-repeat; image-rendering:pixelated; margin-bottom:10px; }
  #tienda .carta b { display:block; color:#f2e2b0; font-size:12px; letter-spacing:2px; margin-bottom:8px; }
  #tienda .carta span { display:block; color:#9c8a6d; font-size:11px; line-height:1.45; min-height:46px; }
  #tienda .carta em { display:block; color:#e8c14a; font-size:15px; font-style:normal; margin-top:10px; }
  #tienda .pie { display:flex; align-items:center; justify-content:space-between; margin-top:24px; }
  #tienda .bolsa { color:#e8c14a; font-size:13px; letter-spacing:4px; }
  #tienda .seguir { padding:11px 26px; background:#4a3418; color:#f2e2b0; border:2px solid #6b4a22;
                    font-family:inherit; font-size:12px; letter-spacing:4px; cursor:pointer; }
  #tienda .seguir:hover { background:#6b4a22; }

  #dano { position:fixed; inset:0; background:#8b0000; opacity:0; pointer-events:none; transition:opacity .28s; }
  #diag { position:fixed; top:8px; left:10px; color:#7fe07f; font-size:11px; white-space:pre; opacity:.5; }
</style>
</head>
<body>
  <canvas id="lienzo"></canvas>
  <div id="capa">
    <div id="mira"></div>
    <canvas id="marcas"></canvas>
    <canvas id="mapa" width="208" height="150"></canvas>
    <div id="cara"></div>
    <div class="caja" id="cVida"><b id="vida">100</b><span>VIDA</span></div>
    <div class="caja chica" id="cArmadura"><b id="armadura">0</b><span>ESCUDO</span></div>
    <div class="caja chica" id="cRayo"><b id="rayo">100</b><span>RAYO</span></div>
    <div class="caja" id="cFlechas"><b id="flechas">40</b><span>FLECHAS</span></div>
    <div class="caja chica" id="cRonda"><b id="ronda">1</b><span>RONDA</span></div>
    <div class="caja chica" id="cVivos"><b id="vivos">0</b><span>ENEMIGOS</span></div>
    <div class="caja chica" id="cOro"><b id="oro">0</b><span>ORO</span></div>
    <div class="caja chica" id="cBajas"><b id="bajas">0</b><span>BAJAS</span></div>
    <div id="banner"><b></b><span></span></div>
    <div id="aviso"></div>
    <div id="ranuras"></div>
  </div>
  <div id="dano"></div>
  <div id="diag"></div>
  <div id="menu">
    <h1>NOSTOS</h1>
    <h2>EL REGRESO</h2>
    <p>CLIC PARA EMPEZAR</p>
    <div id="botonera">
      <button class="boton" id="verControles">VER BOTONES</button>
      <button class="boton" id="verObjetos">OBJETOS</button>
      <button class="boton" id="verEstilo">APARIENCIA</button>
      <button class="boton salir" id="alMenu" hidden>SALIR AL MENU</button>
    </div>
  </div>
  <div id="panel"><div class="hoja"></div></div>

  <script type="importmap">
  { "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  } }
  </script>
  <script type="module" src="./src/main.js?v=20260905153439"></script>
</body>
</html>
