<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tu pedido — Deportes Martínez</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="canonical" href="https://tuagentedeia.com/deportes-martinez/pedido.html">
  <meta name="theme-color" content="#08070a">
  <link rel="icon" href="fotos/logo/favicon.png">
  <link rel="stylesheet" href="css/styles.css?v=77">
  <style>
    .pd-caja{max-width:560px;margin:0 auto;background:#101014;border:1px solid #24242c;border-radius:20px;padding:30px 24px;text-align:center}
    .pd-icono{width:64px;height:64px;border-radius:50%;margin:0 auto 16px;display:grid;place-items:center;font-size:30px;font-weight:800;background:#2a2109;color:#f7d154;border:1px solid #4a3f18}
    .pd-icono--espera{background:#141c2a;color:#8fb8ea;border-color:#2a3b57}
    .pd-icono--mal{background:#2a1212;color:#ff9b9b;border-color:#4a2222}
    .pd-titulo{font-family:var(--display,serif);font-size:28px;margin:0 0 8px;color:var(--ink,#f4f4f5)}
    .pd-sub{color:#a8a8b0;font-size:14.5px;line-height:1.6;margin:0 0 22px}
    .pd-folio{display:flex;align-items:center;gap:12px;flex-wrap:wrap;justify-content:center;background:#15151a;border:1px dashed #3a3a44;border-radius:14px;padding:16px;margin-bottom:14px}
    .pd-folio__k{width:100%;font-size:11.5px;color:#8a8a92;letter-spacing:.06em;text-transform:uppercase}
    .pd-folio__v{font-family:var(--mono,monospace);font-size:26px;letter-spacing:.1em;color:#f4f4f5}
    .pd-folio__cp{background:none;border:1px solid #2e2e38;color:var(--accent,#e8b923);border-radius:8px;padding:6px 13px;font-size:12px;font-weight:700;cursor:pointer;font-family:inherit}
    .pd-aviso{background:#2a2109;border:1px solid #4a3f18;color:#f7d154;border-radius:12px;padding:12px 14px;font-size:13.5px;line-height:1.6;text-align:left;margin:0 0 18px}
    .pd-nota{color:#a8a8b0;font-size:13.5px;margin:0 0 18px}
    .pd-lista{list-style:none;margin:0 0 16px;padding:0;text-align:left}
    .pd-lista li{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid #22222a;font-size:14px}
    .pd-lista li span{color:#8a8a92;font-size:13px;white-space:nowrap}
    .pd-entrega{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;text-align:left;font-size:13.5px;margin:0 0 22px}
    .pd-entrega__k{font-weight:800;color:#f4f4f5}
    .pd-entrega__v{color:#a8a8b0}
    .pd-acciones{display:flex;flex-direction:column;gap:10px}
    .pd-acciones .btn-cta{display:block;text-align:center}
    .pd-btn{display:block;text-align:center;border:1px solid #2e2e38;color:#f4f4f5;border-radius:12px;padding:13px;font-weight:700;font-size:14px;text-decoration:none}
    .pd-btn:hover{border-color:var(--accent,#e8b923);color:var(--accent,#e8b923)}
  </style>
</head>
<body>
  <header class="hdr">
    <div class="wrap hdr__in">
      <a href="index.html" class="brand" aria-label="Deportes Martínez">
        <img class="brand__iso" src="fotos/logo/favicon.png" alt="">
        <span class="brand__word">
          <span class="brand__name">DEPORTES MARTÍNEZ</span>
          <span class="brand__sub">Cumplimos sueños y vestimos campeones</span>
        </span>
      </a>
      <nav class="nav">
        <a href="futbol.html">Futbol</a>
        <a href="basket.html">Basketball</a>
        <a href="americano.html">Americano</a>
        <a href="index.html#noticias">Novedades</a>
        <a href="index.html#contacto">Contacto</a>
      </nav>
    </div>
  </header>

  <main class="wrap sec sec--top">
    <div id="pedido"><p class="pd-sub" style="text-align:center">Cargando tu pedido…</p></div>
  </main>

  <div class="toast-wrap" id="toasts"></div>
  <script type="module" src="js/pedido.js?v=77"></script>
  <script type="module" src="js/auth.js?v=77"></script>
  <script type="module" src="js/cookies.js?v=77"></script>
  <script type="module" src="js/track.js?v=77"></script>
</body>
</html>
