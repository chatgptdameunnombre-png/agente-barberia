<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Promotores — Deportes Martínez</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" href="fotos/logo/iso-blanco.png">
  <link rel="stylesheet" href="css/styles.css?v=104">
</head>
<body class="admin-body">

  <div class="login-screen" id="loader">
    <div style="text-align:center;color:var(--muted)">Cargando…</div>
  </div>

  <div id="dash" hidden>
    <header class="admin-top">
      <div class="admin-top__in">
        <a href="panel.html" class="btn btn--ghost">← Panel</a>
        <span class="admin-top__titulo">Promotores</span>
      </div>
    </header>

    <main class="prm">
      <section class="prm__caja">
        <h2 class="prm__t">Nuevo promotor</h2>
        <p class="prm__p">Escribe su nombre. Te da su link y su código para mandárselos.</p>
        <form id="prmForm" class="prm__form" autocomplete="off">
          <input class="input" id="prmNombre" maxlength="40" placeholder="Ej. Juan Pérez" required>
          <button class="btn" type="submit" id="prmCrear">Crear</button>
        </form>
        <div id="prmNuevo"></div>
      </section>

      <section class="prm__caja">
        <div class="prm__cab">
          <h2 class="prm__t">Resultados</h2>
          <button class="btn btn--ghost" id="prmRecargar">Actualizar</button>
        </div>
        <p class="prm__p">Visitas que entraron con su link (se le cuentan 30 días aunque regresen sin el link), personas distintas, compras y lo vendido sin cancelar.</p>
        <div id="prmTabla">Cargando…</div>
      </section>
    </main>
  </div>

  <script type="module" src="js/promotores.js?v=104"></script>
</body>
</html>
